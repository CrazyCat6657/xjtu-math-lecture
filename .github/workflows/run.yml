name: 学术讲座推送

on:
  schedule:
    # GitHub Actions 的定时任务为尽力而为调度，公共仓库高峰期可能延迟，
    # 实际每天会触发若干次（非精确整点），足以保证新讲座及时送达。
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-lectures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行爬虫
        env:
          SEND_KEY: ${{ secrets.SEND_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_AUTH_CODE: ${{ secrets.EMAIL_AUTH_CODE }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python lecture_spider.py

      - name: 保存历史
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lecture_history.json .health.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 更新讲座历史记录" && git push)
